name: myproject-b

services:
    db:
        image: postgres:15-alpine
        volumes:
            - ./postgre/data:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        restart: always
        ports:
            - 5841:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: .
            dockerfile: dockerfiles/dev/django/Dockerfile
        command: >
            bash -c " python -c ' import socket, time while True:
                try:
                    s = socket.create_connection((\"db\", 5432), timeout=1)
                    s.close()
                    break
                except OSError:
                    print(\"Waiting for database...\")
                    time.sleep(1)
            '; python manage.py runserver 0.0.0.0:8000 "


        volumes:
            - ./core:/usr/src/app
        ports:
            - "9999:8000"
        environment:
            - SECRET_KEY=test
            - DEBUG=True
            - SHOW_DEBUGGER_TOOLBAR=True
        restart: always
        depends_on:
            db:
                condition: service_healthy
