{% extends 'dashboard/customer/base.html' %}
{% load static %}

{% block title %}افزودن آدرس جدید | ElmVHonar{% endblock %}

{% block content %}
<div class="topbar">
    <div class="icon-group">
        <button class="icon-btn">
            <span class="badge">2</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.7 21a2 2 0 0 1-3.4 0" />
            </svg>
        </button>
        <button class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2l1.5 5h9L18 2" />
                <path d="M3.5 7h17l-1.6 12.1a2 2 0 0 1-2 1.9H7.1a2 2 0 0 1-2-1.9L3.5 7z" />
                <circle cx="9.5" cy="12.5" r="0" />
            </svg>
        </button>
    </div>

    <div class="user-chip">
        <div class="user-meta">
            <div class="name">علی عزیز</div>
            <div class="greet">خوش آمدید</div>
        </div>
        <div class="avatar">ع</div>
    </div>
</div>

<h2 class="page-title">افزودن آدرس جدید</h2>
<p class="page-sub">اطلاعات آدرس جدید خود را وارد کنید.</p>

<form class="card address-form-card" method="post" action="{% url 'dashboard:customer:address-edit' pk=address.id %}">
    {% csrf_token %}

    <div class="form-field">
        <label for="address">نشانی <span class="required">*</span></label>
        <div class="field-box">
            <textarea id="address" name="address" placeholder="نشانی کامل خود را وارد کنید..." rows="3" required>
                {{ address.address }}
            </textarea>
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" />
                    <circle cx="12" cy="10" r="2.5" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-field">
        <label for="city">شهر <span class="required">*</span></label>
        <div class="field-box select-box">
            <select id="city" name="city" required>
                <option value="" selected disabled>انتخاب شهر</option>
                <option value="tehran"{% if address.city == 'تهران' %}selected{% endif %}>تهران</option>
                <option value="karaj"{% if address.city == 'کرج' %}selected{% endif %}>کرج</option>
                <option value="mashhad"{% if address.city == 'مشهد' %}selected{% endif %}>مشهد</option>
                <option value="isfahan"{% if address.city == 'اصفهان' %}selected{% endif %}>اصفهان</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
            </svg>
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" />
                    <circle cx="12" cy="10" r="2.5" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-field">
        <label for="state">استان <span class="required">*</span></label>
        <div class="field-box select-box">
            <select id="state" name="state" required>
                <option value="" selected disabled>انتخاب استان</option>
                <option value="tehran"{% if address.state == 'تهران' %}selected{% endif %}>تهران</option>
                <option value="alborz"{% if address.state == 'البرز' %}selected{% endif %}>البرز</option>
                <option value="razavi-khorasan"{% if address.state == 'خراسان رضوی' %}selected{% endif %}>خراسان رضوی</option>
                <option value="isfahan"{% if address.state == 'اصفهان' %}selected{% endif %}>اصفهان</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
            </svg>
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z" />
                    <path d="M9 4v14" />
                    <path d="M15 6v14" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-field">
        <label for="zip_code">کد پستی <span class="required">*</span></label>
        <div class="field-box">
            <input type="text" id="zip_code" name="zip_code" placeholder="کد پستی ۱۰ رقمی خود را وارد کنید" inputmode="numeric"
                maxlength="10" required value="{{ address.zip_code }}">
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 8L12 3 4 8v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M4 8l8 5 8-5" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">
            ذخیره آدرس
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                <path d="M17 21v-8H7v8" />
                <path d="M7 3v5h8" />
            </svg>
        </button>
        <a href="{% url 'dashboard:customer:address-list' %}" class="btn-secondary">انصراف</a>
    </div>
</form>
{% endblock %}
