{% extends 'dashboard/customer/base.html' %}
{% load static %}

{% block title %}افزودن آدرس جدید | ElmVHonar{% endblock %}

{% block content %}


<h2 class="page-title">افزودن آدرس جدید</h2>
<p class="page-sub">اطلاعات آدرس جدید خود را وارد کنید.</p>

<form class="card address-form-card" method="post" action="{% url 'dashboard:customer:address-edit' pk=address.id %}">
    {% csrf_token %}

    <div class="form-field">
        <label for="address">نشانی <span class="required">*</span></label>
        <div class="field-box">
            <textarea id="address" name="address" placeholder="نشانی کامل خود را وارد کنید..." rows="3" required>
                {{ address.address }}
            </textarea>
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" />
                    <circle cx="12" cy="10" r="2.5" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-field">
        <label for="city">شهر <span class="required">*</span></label>
        <div class="field-box select-box">
            <select name="city" required>
                <option value="" selected disabled>انتخاب شهر</option>
                <option value="tehran"{% if address.city == 'tehran' %}selected{% endif %}>تهران</option>
                <option value="karaj"{% if address.city == 'karaj' %}selected{% endif %}>کرج</option>
                <option value="mashhad"{% if address.city == 'mashhad' %}selected{% endif %}>مشهد</option>
                <option value="isfahan"{% if address.city == 'isfahan' %}selected{% endif %}>اصفهان</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
            </svg>
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" />
                    <circle cx="12" cy="10" r="2.5" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-field">
        <label for="state">استان <span class="required">*</span></label>
        <div class="field-box select-box">
            <select name="state" required>
                <option value="" selected disabled>انتخاب استان</option>
                <option value="tehran" {% if address.state == 'tehran' %}selected{% endif %}>تهران</option>
                <option value="alborz" {% if address.state == 'alborz' %}selected{% endif %}>البرز</option>
                <option value="razavi-khorasan" {% if address.state == 'razavi-khorasan' %}selected{% endif %}>خراسان رضوی</option>
                <option value="isfahan" {% if address.state == 'isfahan' %}selected{% endif %}>اصفهان</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
            </svg>
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z" />
                    <path d="M9 4v14" />
                    <path d="M15 6v14" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-field">
        <label for="zip_code">کد پستی <span class="required">*</span></label>
        <div class="field-box">
            <input type="text" id="zip_code" name="zip_code" placeholder="کد پستی ۱۰ رقمی خود را وارد کنید" inputmode="numeric"
                maxlength="10" required value="{{ address.zip_code }}">
            <span class="field-icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 8L12 3 4 8v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M4 8l8 5 8-5" />
                </svg>
            </span>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">
            ذخیره آدرس
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                <path d="M17 21v-8H7v8" />
                <path d="M7 3v5h8" />
            </svg>
        </button>
        <a href="{% url 'dashboard:customer:address-list' %}" class="btn-secondary">انصراف</a>
    </div>
</form>
{% endblock %}
