{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ElmVHonar | پنل کاربری مشتری{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/customer-dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">

</head>

<body>
    <div class="layout">

        <!-- ===================== SIDEBAR ===================== -->
        <aside class="sidebar">
            <div class="brand">
                <h1>ElmVHonar</h1>
                <p>پنل کاربری مشتری</p>
            </div>

            <nav class="nav">
                <a href="{% url 'dashboard:customer:home' %}"
                    class="nav-item {% if active_page == 'profile' %}active{% endif %}">
                    مشخصات من
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
                    </svg>
                </a>
                <a href="{% url 'dashboard:customer:address-list' %}"
                    class="nav-item {% if active_page == 'addresses' %}active{% endif %}">
                    آدرس‌های من
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" />
                        <circle cx="12" cy="10" r="2.5" />
                    </svg>
                </a>
                <a href="{% url 'dashboard:customer:order' %}"
                    class="nav-item {% if active_page == 'orders' %}active{% endif %}">
                    سفارش‌های من
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 8l-9-5-9 5 9 5 9-5z" />
                        <path d="M3 8v8l9 5 9-5V8" />
                        <path d="M12 13v8" />
                    </svg>
                </a>
                <a href="{% url 'dashboard:customer:setting' %}"
                    class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    تنظیمات
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
                    </svg>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="{% url 'website:home' %}" class="logout-btn">
                    خروج از حساب
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <path d="M16 17l5-5-5-5" />
                        <path d="M21 12H9" />
                    </svg>
                </a>
            </div>
        </aside>

        <!-- ===================== MAIN ===================== -->
        <main class="main">
            {% block content %}

            {% endblock %}
        </main>
    </div>
</body>

</html>
