{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}پنل مدیریت | علم و هنر{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
    type="text/css" />
  <link rel="stylesheet" href="{% static 'css/admin-dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body>

  <div class="admin-shell">

    <!-- =====================================================================
         ۱) سایدبار — سمت راست
         این «aside» رو عیناً همینجوری تو base.html نگه دار. مشترکه بین همه‌ی صفحات.
         active بودن هر آیتم رو با نام یو‌آر‌ال جاری (request.resolver_match.url_name)
         چک کردم؛ اگه اسم url هات فرق داره فقط همون رشته‌ها رو عوض کن.
    ===================================================================== -->
    <aside class="sidebar">

      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <div class="brand-title">ElmVHonar</div>
          <div class="brand-subtitle">پنل مدیریت فروشگاه</div>
        </div>
      </div>

      <nav class="sidebar-nav">

        <a href="{% url 'dashboard:admin:home' %}"
          class="nav-item {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2" y="2" width="6" height="6" rx="1.4" />
              <rect x="10" y="2" width="6" height="6" rx="1.4" />
              <rect x="2" y="10" width="6" height="6" rx="1.4" />
              <rect x="10" y="10" width="6" height="6" rx="1.4" />
            </svg>
          </span>
          <span>گزارش‌های کلی</span>
        </a>

        <a href="{% url 'dashboard:admin:orders' %}"
          class="nav-item {% if request.resolver_match.url_name == 'orders-list' %}active{% endif %}">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2.5" y="4" width="13" height="11" rx="1.6" />
              <path d="M6 4V3a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 12 3v1" />
            </svg>
          </span>
          <span>سفارشات</span>
        </a>

        <a href="{% url 'dashboard:admin:products-list' %}"
          class="nav-item {% if request.resolver_match.url_name == 'products-list' %}active{% endif %}">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M9 2l6.5 3.5v7L9 16l-6.5-3.5v-7L9 2z" />
              <path d="M2.5 5.5L9 9l6.5-3.5M9 9v7" />
            </svg>
          </span>
          <span>محصولات</span>
        </a>

        <a href="{% url 'dashboard:admin:security-edit' %}"
          class="nav-item {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="9" cy="9" r="2.4" />
              <path
                d="M9 1.5v2M9 14.5v2M2.6 9h2M13.4 9h2M4.4 4.4l1.4 1.4M12.2 12.2l1.4 1.4M13.6 4.4l-1.4 1.4M5.8 12.2l-1.4 1.4" />
            </svg>
          </span>
          <span>تنظیمات</span>
        </a>

      </nav>

      <div class="sidebar-footer">
        <a href="{% url 'website:home' %}" class="logout-btn">
          خروج از حساب
        </a>
      </div>
    </aside>


    <div class="main-area">
      <!-- =====================================================================
           ۳) از اینجا به بعد مخصوص هر صفحه‌ست — این تو base.html نمی‌مونه
           هر تمپلیت فرزند (مثل dashboard-home.html) این بلاک رو پر می‌کنه.
      ===================================================================== -->
      <main class="content">
        {% block content %}{% endblock %}
      </main>

    </div><!-- /main-area -->
  </div><!-- /admin-shell -->

  {% block extra_js %}{% endblock %}

</body>

</html>
