{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElmVHonar — بازیابی رمز عبور</title>
    <meta name="description" content="بازیابی رمز عبور حساب کاربری فروشگاه علم و هنر" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" />

    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}" />
</head>

<body>
    <section class="card">
        <div class="logo-wrap">
            <div class="logo">
                <svg class="feather" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 6C24 8 16 14 10 24C8 27 7 30 6 34C10 33 14 31 18 28C24 24 29 17 32 6Z"
                        fill="#b5793f" />
                    <path d="M32 6C26 12 20 18 12 26" stroke="#8a5a2b" stroke-width="1" stroke-linecap="round" />
                </svg>
                <span style="margin-right: 2px">H</span>
                E
            </div>
        </div>

        <h1 class="title">بازیابی رمز عبور</h1>
        <p class="subtitle">ایمیلی که با آن ثبت‌نام کرده‌اید را وارد کنید تا لینک بازیابی برایتان ارسال شود</p>

        <form method="post" aria-label="فرم بازیابی رمز عبور">
            {% csrf_token %}

            <div class="field">
                <label for="id_email">آدرس ایمیل</label>
                <div class="input-wrap">
                    <input type="email" id="id_email" name="email" dir="ltr" placeholder="ایمیل خود را وارد کنید"
                        aria-required="true" />
                    <span class="icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2" />
                            <path d="M3 7l9 6 9-6" />
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-arrow" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <path d="M10 17l5-5-5-5" />
                        <path d="M15 12H3" />
                    </svg>
                </span>
                <span class="btn-text">ارسال لینک بازیابی</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </form>

        <p class="login-register">
            رمز عبور خود را به یاد آوردید؟
            <a href="{% url 'accounts:login' %}">بازگشت به ورود</a>
        </p>
    </section>

    <script src="{% static 'vendor/toastify/toastify.js' %}"></script>
    {% include 'messages.html' %}
</body>

</html>
