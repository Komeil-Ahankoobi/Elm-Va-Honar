{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElmVHonar — تایید کد</title>
    <meta name="description" content="تایید کد پیامک شده فروشگاه علم و هنر" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" />

    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}" />
</head>

<body>
    <section class="card">
        <div class="logo-wrap">
            <div class="logo">
                <svg class="feather" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 6C24 8 16 14 10 24C8 27 7 30 6 34C10 33 14 31 18 28C24 24 29 17 32 6Z"
                        fill="#b5793f" />
                    <path d="M32 6C26 12 20 18 12 26" stroke="#8a5a2b" stroke-width="1" stroke-linecap="round" />
                </svg>
                <span style="margin-right: 2px">H</span>
                E
            </div>
        </div>

        <h1 class="title">تایید شماره تلفن</h1>
        <p class="subtitle">کد ۵ رقمی ارسال شده به شماره شما را وارد کنید</p>

        {% if form.errors %}
        <div class="form-alert-error" role="alert">{{ form.errors }}</div>
        {% endif %}

        <form action="" method="post" aria-label="فرم تایید کد">
            {% csrf_token %}

            <div class="field">
                <label for="code">کد تایید</label>
                <div class="input-wrap">
                    <input type="text" id="code" name="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code"
                        maxlength="6" class="otp-input" placeholder="- - - - -" aria-required="true"
                        aria-describedby="code-error" />
                    <span class="icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                </div>
                <p class="form-error" id="code-error" role="alert">کد وارد شده اشتباه یا منقضی شده است.</p>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-arrow" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <path d="M10 17l5-5-5-5" />
                        <path d="M15 12H3" />
                    </svg>
                </span>
                <span class="btn-text">تایید و ورود</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </form>

        <p class="login-register">
            کد را دریافت نکردید؟
            <a href="#" id="resend-link" class="resend-disabled">ارسال مجدد (<span id="resend-timer">۱۲۰</span>)</a>
        </p>
    </section>

    <script>
        // شمارش معکوس ۱۲۰ ثانیه‌ای + ارسال مجدد کد بدون خروج از صفحه (AJAX)
        (function () {
            var COOLDOWN = 120;
            var seconds = COOLDOWN;
            var timerEl = document.getElementById('resend-timer');
            var linkEl = document.getElementById('resend-link');
            var interval = null;
            var isRequesting = false;

            function getCsrfToken() {
                var input = document.querySelector('input[name="csrfmiddlewaretoken"]');
                return input ? input.value : '';
            }

            function showToast(message, isError) {
                if (typeof Toastify === 'function') {
                    Toastify({
                        text: message,
                        duration: 3500,
                        gravity: 'top',
                        position: 'center',
                        style: { background: isError ? '#dc3545' : '#28a745' },
                    }).showToast();
                }
            }

            function setDisabledState() {
                linkEl.classList.add('resend-disabled');
                linkEl.textContent = '';
                linkEl.appendChild(document.createTextNode('ارسال مجدد ('));
                var span = document.createElement('span');
                span.id = 'resend-timer';
                span.textContent = seconds;
                linkEl.appendChild(span);
                linkEl.appendChild(document.createTextNode(')'));
                timerEl = span;
            }

            function startCountdown() {
                seconds = COOLDOWN;
                setDisabledState();
                clearInterval(interval);
                interval = setInterval(function () {
                    seconds -= 1;
                    if (seconds <= 0) {
                        clearInterval(interval);
                        linkEl.textContent = 'ارسال مجدد کد';
                        linkEl.classList.remove('resend-disabled');
                    } else {
                        timerEl.textContent = seconds;
                    }
                }, 1000);
            }

            function requestNewCode() {
                if (isRequesting) return;
                isRequesting = true;
                var originalText = linkEl.textContent;
                linkEl.textContent = 'در حال ارسال...';

                fetch('{% url "accounts:resend_otp" %}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCsrfToken(),
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                })
                    .then(function (res) {
                        return res.json().then(function (data) {
                            return { ok: res.ok, data: data };
                        });
                    })
                    .then(function (result) {
                        isRequesting = false;
                        if (result.ok && result.data.success) {
                            showToast(result.data.message || 'کد جدید ارسال شد.', false);
                            startCountdown();
                        } else {
                            showToast(result.data.message || 'ارسال کد با خطا مواجه شد.', true);
                            linkEl.textContent = originalText;
                        }
                    })
                    .catch(function () {
                        isRequesting = false;
                        showToast('ارتباط با سرور برقرار نشد. دوباره تلاش کنید.', true);
                        linkEl.textContent = originalText;
                    });
            }

            linkEl.addEventListener('click', function (e) {
                e.preventDefault();
                if (!linkEl.classList.contains('resend-disabled') && !isRequesting) {
                    requestNewCode();
                }
            });

            startCountdown();
        })();
    </script>

    <script src="{% static 'vendor/toastify/toastify.js'%}"></script>

    {% include 'messages.html' %}
</body>

</html>
