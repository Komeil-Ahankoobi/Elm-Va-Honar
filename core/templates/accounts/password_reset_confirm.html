{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElmVHonar — تعیین رمز عبور جدید</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" />

    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/toastify/toastify.css' %}" />
</head>

<body>
    <section class="card">
        <div class="logo-wrap">
            <div class="logo">
                <svg class="feather" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 6C24 8 16 14 10 24C8 27 7 30 6 34C10 33 14 31 18 28C24 24 29 17 32 6Z"
                        fill="#b5793f" />
                    <path d="M32 6C26 12 20 18 12 26" stroke="#8a5a2b" stroke-width="1" stroke-linecap="round" />
                </svg>
                <span style="margin-right: 2px">H</span>
                E
            </div>
        </div>

        {% if validlink %}
        <h1 class="title">تعیین رمز عبور جدید</h1>
        <p class="subtitle">رمز عبور جدید خود را وارد کنید</p>

        <form method="post" aria-label="فرم تعیین رمز عبور جدید">
            {% csrf_token %}

            <div class="field">
                <label for="id_new_password1">رمز عبور جدید</label>
                <div class="input-wrap">
                    <input type="password" id="id_new_password1" name="new_password1" dir="ltr"
                        placeholder="رمز عبور جدید" autocomplete="new-password" aria-required="true" />
                    <button type="button" class="pwd-toggle" id="pwd-toggle-1" aria-label="نمایش رمز عبور">
                        <svg id="eye-icon-1" width="16" height="16" viewBox="0 0 16 16" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" />
                            <circle cx="8" cy="8" r="2" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="id_new_password2">تکرار رمز عبور جدید</label>
                <div class="input-wrap">
                    <input type="password" id="id_new_password2" name="new_password2" dir="ltr"
                        placeholder="تکرار رمز عبور جدید" autocomplete="new-password" aria-required="true" />
                    <button type="button" class="pwd-toggle" id="pwd-toggle-2" aria-label="نمایش رمز عبور">
                        <svg id="eye-icon-2" width="16" height="16" viewBox="0 0 16 16" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" />
                            <circle cx="8" cy="8" r="2" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-arrow" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <path d="M10 17l5-5-5-5" />
                        <path d="M15 12H3" />
                    </svg>
                </span>
                <span class="btn-text">تغییر رمز عبور</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </form>

        {% else %}
        <h1 class="title">لینک نامعتبر</h1>
        <p class="subtitle">لینک بازیابی رمز عبور نامعتبر است یا قبلاً استفاده شده است.</p>
        <p class="login-register">
            <a href="{% url 'accounts:password_reset' %}">درخواست لینک جدید</a>
        </p>
        {% endif %}
    </section>

    <script src="{% static 'js/login.js' %}" defer></script>
    <script src="{% static 'vendor/toastify/toastify.js' %}"></script>
    {% include 'messages.html' %}
</body>

</html>
