{% extends "admin/base_site.html" %}
{% load i18n static %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <p>موارد انتخاب‌شده:</p>
    <ul>
        {% for product in products %}
            <li>{{ product }} — تخفیف فعلی: {{ product.discount_percent }}٪</li>
        {% endfor %}
    </ul>
    {{ form.as_p }}
    <input type="hidden" name="action" value="set_discount_percent">
    <input type="submit" name="apply" value="اعمال تخفیف">
</form>
{% endblock %}
