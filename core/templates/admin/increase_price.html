{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>محصولات انتخاب‌شده:</p>
    <ul>
        {% for product in products %}
            <li>{{ product.title }} — قیمت فعلی: {{ product.price }}</li>
        {% endfor %}
    </ul>

    {{ form.as_p }}

    <input type="hidden" name="action" value="increase_price_custom">
    <input type="submit" name="apply" value="اعمال تغییرات">
</form>
{% endblock %}
